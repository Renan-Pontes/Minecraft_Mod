plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Bibliotecas (GeckoLib, Curios, SmartBrainLib, Player Animator) vêm do Modrinth.
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

// Bibliotecas obrigatórias do Isekai Mahou (versões NeoForge 1.21.1).
// Os IDs são as versões exatas no Modrinth (ver comentário ao lado).
ext.isekaiLibs = [
        "maven.modrinth:geckolib:Grwn5rUB",        // GeckoLib 4.9.3
        "maven.modrinth:curios:yohfFbgD",          // Curios API 9.5.1
        "maven.modrinth:smartbrainlib:O5EpeqI3",   // SmartBrainLib 1.16.11
        "maven.modrinth:playeranimator:HJZB6bmA",  // Player Animator 2.0.4
]

// Mods facilitadores (NÃO são dependência do Isekai Mahou): vão junto pra pasta mods do TLauncher.
// Teste local com eles: ./gradlew runClient -PwithQol
ext.qolMods = [
        "maven.modrinth:jade:eYz2YBGT",             // Jade 15.10.6 (vida e informações do que você olha)
        "maven.modrinth:jei:ufHUqt9b",              // JEI 19.51.0.418 (receitas)
        "maven.modrinth:appleskin:uAKA6Laj",        // AppleSkin 3.0.9 (fome/saturação)
        "maven.modrinth:xaeros-minimap:irjR7dHk",   // Xaero's Minimap 26.6.0
        "maven.modrinth:xaeros-world-map:SnQ4SoDe", // Xaero's World Map 1.47.0
        "maven.modrinth:mouse-tweaks:9I21YYxf",     // Mouse Tweaks 2.26.1
        // v1.3 — desempenho (mais FPS e mais chunks sem lag). Todos sem dependências extras no Modrinth.
        "maven.modrinth:sodium:uMOpc5uV",           // Sodium 0.8.13 (NeoForge oficial): renderizador de chunks muito mais rápido
        "maven.modrinth:ferrite-core:x7kQWVju",     // FerriteCore 7.0.3: bem menos RAM usada
        "maven.modrinth:modernfix:ZDZENbHH",        // ModernFix 5.27.27: carrega mais rápido, menos RAM, corrige travadas
        "maven.modrinth:immediatelyfast:EJzmEPZV",  // ImmediatelyFast 1.6.15: HUD, textos e mapas desenhados mais rápido
        "maven.modrinth:entityculling:eieYbWYb",    // Entity Culling 1.11.3: não desenha mobs/baús escondidos atrás de paredes
        "maven.modrinth:distanthorizons:9w34y8ai",  // Distant Horizons 3.3.3: terreno distante em LOD (enxergar longe sem lag)
]

configurations {
    // Jars das bibliotecas que vão junto pra pasta mods do TLauncher
    deployLibs { transitive = false }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Teste automatico: ./gradlew runClient -PquickPlay=<mundo> abre direto esse mundo de run/saves
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            }
            // Teste com o servidor de desenvolvimento: ./gradlew runClient -PquickPlayServer=localhost
            if (project.hasProperty('quickPlayServer')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('quickPlayServer').toString())
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    isekaiLibs.each { lib ->
        implementation lib
        deployLibs lib
    }
    qolMods.each { m ->
        deployLibs m
        if (project.hasProperty('withQol')) localRuntime m
    }

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Copia o .jar final do mod para a pasta "output" sempre que rodar o build
// (é dessa pasta que você pega o mod pra colocar na pasta mods do launcher).
var copyToOutput = tasks.register('copyToOutput', Copy) {
    from tasks.named('jar')
    into layout.projectDirectory.dir('output')
}
tasks.named('build') { finalizedBy copyToOutput }

// Instala o mod no perfil NeoForge 1.21.1 do TLauncher, apagando antes as versões antigas do Isekai Mahou
// (só mexe em arquivos isekai_mahou-*.jar; outros mods da pasta não são tocados).
var tlauncherModsDir = providers.gradleProperty('tlauncher_mods_dir').orElse('').get()
var deployToTLauncher = tasks.register('deployToTLauncher', Sync) {
    onlyIf { !tlauncherModsDir.isBlank() && new File(tlauncherModsDir).isDirectory() }
    from tasks.named('jar')
    from configurations.deployLibs
    into tlauncherModsDir
    preserve {
        include '**'
        exclude "${mod_id}-*.jar"
        // versões antigas das bibliotecas que a gente gerencia são substituídas
        exclude "geckolib-*.jar", "curios-*.jar", "SmartBrainLib-*.jar", "player-animation-lib-*.jar"
        exclude "*Grwn5rUB*", "*yohfFbgD*", "*O5EpeqI3*", "*HJZB6bmA*"
        // versões antigas dos mods facilitadores que a gente instala
        exclude "jade-*.jar", "jei-*.jar", "appleskin-*.jar", "xaeros-minimap-*.jar", "xaeros-world-map-*.jar", "mouse-tweaks-*.jar"
        // v1.3: mods de desempenho (versões antigas, inclusive baixadas à mão, são trocadas pelas nossas;
        // Embeddium sai porque é incompatível com o Sodium)
        exclude "sodium-*.jar", "ferrite-core-*.jar", "ferritecore-*.jar", "modernfix-*.jar", "immediatelyfast-*.jar",
                "ImmediatelyFast-*.jar", "entityculling-*.jar", "distanthorizons-*.jar", "DistantHorizons-*.jar", "embeddium-*.jar"
    }
}
tasks.named('build') { finalizedBy deployToTLauncher }


// ---------------------------------------------------------------------------------------------
// Traduções por módulo: cada módulo tem src/main/lang/<modulo>/pt_br.json e en_us.json.
// Esta tarefa junta tudo em assets/isekai_mahou/lang/*.json (e falha se houver chave duplicada
// com textos diferentes, pra pegar conflito entre módulos).
// ---------------------------------------------------------------------------------------------
def langSrc = file("src/main/lang")
def langOut = layout.buildDirectory.dir("generated/lang").get().asFile
var mergeLang = tasks.register("mergeLang") {
    inputs.dir(langSrc)
    outputs.dir(langOut)
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def merged = [:]
        def origin = [:]
        langSrc.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith(".json")) return
            def lang = f.name - ".json"
            def map = merged.computeIfAbsent(lang) { new TreeMap() }
            def parsed = slurper.parse(f, "UTF-8")
            parsed.each { k, v ->
                if (map.containsKey(k) && map[k] != v) {
                    throw new GradleException("Chave de tradução duplicada '${k}' em ${f} (já definida em ${origin[lang + k]})")
                }
                map[k] = v
                origin[lang + k] = f.toString()
            }
        }
        langOut.deleteDir()
        merged.each { lang, map ->
            def out = new File(langOut, "assets/isekai_mahou/lang/${lang}.json")
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(map)), "UTF-8")
        }
    }
}
sourceSets.main.resources.srcDir(files(langOut).builtBy(mergeLang))
tasks.named('processResources') { dependsOn mergeLang }

// Escreve o classpath de compilação em build/classpath.txt (usado por tools/check-module.sh
// pra compilar um módulo isolado com javac, sem rodar o Gradle).
tasks.register("printClasspath") {
    dependsOn tasks.named('compileJava')
    doLast {
        def f = layout.buildDirectory.file("classpath.txt").get().asFile
        f.text = sourceSets.main.compileClasspath.asPath
    }
}

// ---------------------------------------------------------------------------------------------
// Arquivos de dados COMPARTILHADOS entre módulos (tags do Minecraft, tags de bioma, slots do Curios...):
// cada módulo coloca em src/main/merge/<modulo>/<caminho normal de resources>.json
// e esta tarefa junta tudo em build/generated/merge/<caminho>. Tags ("values") são unidas.
// Arquivos não-tag com o mesmo caminho em dois módulos = erro (conflito).
// ---------------------------------------------------------------------------------------------
def mergeSrc = file("src/main/merge")
def mergeOut = layout.buildDirectory.dir("generated/merge").get().asFile
var mergeData = tasks.register("mergeData") {
    inputs.dir(mergeSrc).optional()
    outputs.dir(mergeOut)
    doLast {
        mergeOut.deleteDir()
        mergeOut.mkdirs()
        if (!mergeSrc.isDirectory()) return
        def slurper = new groovy.json.JsonSlurper()
        def groups = [:]
        mergeSrc.eachDir { modDir ->
            modDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                def rel = modDir.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, '/' as char)
                groups.computeIfAbsent(rel) { [] } << f
            }
        }
        groups.each { rel, files ->
            def out = new File(mergeOut, rel)
            out.parentFile.mkdirs()
            if (files.size() == 1 || !rel.endsWith(".json")) {
                if (files.size() > 1) throw new GradleException("Conflito em src/main/merge: ${rel} em ${files}")
                out.bytes = files[0].bytes
                return
            }
            def values = new LinkedHashSet()
            files.each { f ->
                def j = slurper.parse(f, "UTF-8")
                if (!(j instanceof Map) || !(j.values instanceof List)) {
                    throw new GradleException("Só tags ({\"values\": [...]}) podem ser juntadas: ${f}")
                }
                j.values.each { values << it }
            }
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([replace: false, values: values.toList()])), "UTF-8")
        }
    }
}
sourceSets.main.resources.srcDir(files(mergeOut).builtBy(mergeData))
tasks.named('processResources') { dependsOn mergeData }


// ---------------------------------------------------------------------------------------------
// v1.0 RELEASE — pacotes prontos para distribuir (saem em output/):
//   ./gradlew packFriends  → IsekaiMahou-<versão>-Amigos.zip    (pasta mods completa + LEIA-ME do TLauncher)
//   ./gradlew packServer   → IsekaiMahou-<versão>-Servidor.zip  (servidor dedicado: mods, scripts, backup)
// Os textos/scripts ficam em tools/pack/** (@VERSION@ e @NEO@ são trocados aqui).
// ---------------------------------------------------------------------------------------------
def packTokens = [VERSION: mod_version, NEO: neo_version]
// Mods só de cliente (render/entrada): não vão para o servidor dedicado
def clientOnlyMods = ['sodium', 'immediatelyfast', 'entityculling', 'mouse-tweaks', 'distanthorizons']
tasks.register('packFriends', Zip) {
    group = 'isekai'
    description = 'Zip para os amigos: mod + bibliotecas + mods de ajuda + passo a passo.'
    archiveFileName = "IsekaiMahou-${mod_version}-Amigos.zip"
    destinationDirectory = layout.projectDirectory.dir('output')
    filteringCharset = 'UTF-8'
    from('tools/pack/friends') { filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: packTokens) }
    into('mods') {
        from tasks.named('jar')
        from configurations.deployLibs
    }
}
tasks.register('packServer', Zip) {
    group = 'isekai'
    description = 'Pasta de servidor dedicado: mods de servidor, server.properties, instalar/iniciar/backup.'
    archiveFileName = "IsekaiMahou-${mod_version}-Servidor.zip"
    destinationDirectory = layout.projectDirectory.dir('output')
    filteringCharset = 'UTF-8'
    from('tools/pack/server') { filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: packTokens) }
    into('mods') {
        from tasks.named('jar')
        from(configurations.deployLibs) {
            exclude { d -> clientOnlyMods.any { d.file.name.toLowerCase().contains(it) } }
        }
    }
}
